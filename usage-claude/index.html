<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Claude</title>
<style>
  :root { --bg:#14161a; --carte:#1d2026; --texte:#e8eaed; --doux:#9aa0a6; --trait:#3a3f47; --vert:#4caf50; --orange:#f5a524; --rouge:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--texte); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:1.2rem; margin:0; }
  h2 { font-size:.95rem; margin:0 0 8px; color:var(--doux); font-weight:600; }
  .carte { background:var(--carte); border-radius:10px; padding:14px; }
  .grand { font-size:2rem; font-weight:700; }
  .barre { height:12px; background:var(--trait); border-radius:6px; overflow:hidden; margin:8px 0; }
  .barre > div { height:100%; width:0; transition:width .3s; }
  .doux { color:var(--doux); font-size:.9rem; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:6px 8px; margin:4px 0; border-radius:6px; border:1px dashed var(--trait); font-style:italic; }
  li.reel { border:2px solid var(--vert); font-style:normal; }
  .badge { background:var(--vert); color:#000; border-radius:4px; padding:0 6px; font-size:.75rem; margin-left:6px; font-style:normal; }
  #bandeau { background:var(--rouge); color:#fff; border-radius:8px; padding:8px 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Usage Claude</h1>
  <div id="bandeau" hidden>Serveur arrêté : relance usage-claude.cmd</div>
  <div id="vide" class="carte" hidden>Pas encore de données : envoie un message dans Claude Code (abonnement Pro/Max). Diagnostic : %USERPROFILE%\.claude\usage-claude\last-stdin.json</div>
  <div id="contenu" hidden>
    <div class="carte">
      <h2>Session (5 h)</h2>
      <div class="grand" id="p5">—</div>
      <div class="barre"><div id="b5"></div></div>
      <div id="t5"></div>
    </div>
    <div class="carte" style="margin-top:12px">
      <h2>Prochains resets</h2>
      <ul id="liste"></ul>
      <div class="doux" id="legende"></div>
    </div>
    <div class="carte" style="margin-top:12px">
      <h2>Semaine (7 jours)</h2>
      <div class="grand" id="p7">—</div>
      <div class="barre"><div id="b7"></div></div>
      <div id="t7"></div>
    </div>
    <p class="doux" id="pied"></p>
  </div>
</main>
<script src="lib/usage.js"></script>
<script>
  let donnees = null, charge = false;
  const $ = (id) => document.getElementById(id);

  async function recharger() {
    try {
      const r = await fetch('/usage.json', { cache: 'no-store' });
      $('bandeau').hidden = true;
      charge = true;
      if (r.status === 404) donnees = null;
      else if (r.ok) donnees = await r.json();
    } catch (e) {
      if (e instanceof TypeError) $('bandeau').hidden = false;
    }
    rendre();
  }

  function barre(id, w, actif) {
    const b = $(id), v = actif ? Math.min(100, Math.max(0, w.used_percentage)) : 0;
    b.style.width = v + '%';
    b.style.background = v < 50 ? 'var(--vert)' : v < 80 ? 'var(--orange)' : 'var(--rouge)';
  }

  function rendre() {
    const now = Date.now();
    $('vide').hidden = !charge || !!donnees;
    $('contenu').hidden = !donnees;
    if (!donnees) return;
    const f = donnees.five_hour, s = donnees.seven_day;
    const e5 = etatFenetre(f, now), e7 = etatFenetre(s, now);

    $('p5').textContent = e5 === 'active' ? pct(f.used_percentage) : '—';
    barre('b5', f, e5 === 'active');
    $('t5').textContent = e5 === 'active' ? 'Reset dans ' + duree(f.resets_at_ms - now) + ' — à ' + heure(f.resets_at_ms)
      : e5 === 'terminee' ? 'Fenêtre terminée à ' + heure(f.resets_at_ms) + ' — la suivante démarre à ton prochain message' : '—';

    const prochains = prochainsResets(f, now);
    const liste = $('liste');
    liste.textContent = '';
    for (const p of prochains) {
      const li = document.createElement('li');
      const jour = libelleJour(p.at, now);
      li.textContent = (jour === "aujourd'hui" ? '' : jour + ' ') + heure(p.at);
      if (p.reel) {
        li.className = 'reel';
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = 'réel';
        li.appendChild(b);
      }
      liste.appendChild(li);
    }
    $('legende').textContent = prochains[0].reel
      ? 'Les suivants : au plus tôt (si tu envoies un message dès le reset)'
      : 'Au plus tôt, si tu envoies un message maintenant';

    $('p7').textContent = e7 === 'active' ? pct(s.used_percentage) : '—';
    barre('b7', s, e7 === 'active');
    $('t7').textContent = e7 === 'active' ? 'Reset ' + libelleJour(s.resets_at_ms, now) + ' à ' + heure(s.resets_at_ms) + ' — dans ' + duree(s.resets_at_ms - now)
      : e7 === 'terminee' ? 'Semaine réinitialisée — nouveaux chiffres au prochain message' : '—';

    $('pied').textContent = 'Mis à jour ' + age(now - donnees.vu_ms) + " — les % changent seulement quand Claude Code reçoit une réponse (l'usage sur claude.ai n'apparaît qu'au message suivant).";
  }

  recharger();
  setInterval(recharger, 5000);
  setInterval(rendre, 1000);
</script>
</body>
</html>
